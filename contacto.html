<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Contacto</title>
    <link rel="stylesheet" href="css/rodrigo_olavarria_PFY2201_CSS_Semana2.css">
</head>
<body>

    <header>
        <h1>GameZone</h1>
        <img src="imagenes/logo-gamezone.jpg" alt="Logotipo de la tienda GameZone">
        <p>Ponte en contacto con nosotros</p>
    </header>

    <nav>
        <ul>
            <li><a href="rodrigo_olavarria_PFY2201_HTML_Semana1.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <section>
        <h2>Formulario de Contacto</h2>
        
        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <br>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>
        
            <label for="email">Correo Electrónico:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br><br>
            
            <label for="mensaje">Mensaje:</label>
            <br>
            <textarea id="mensaje" name="mensaje" rows="4" cols="50"></textarea>
            <br><br>
            
            <label for="interes">Área de Interés:</label>
            <br>
            <select id="interes" name="interes">
                <option value="desarrollo">Desarrollo Web</option>
                <option value="diseño">Diseño Gráfico</option>
                <option value="marketing">Marketing Digital</option>
            </select>
            <br><br>
            
            <button type="submit" class="btn-comprar">Enviar</button>
        </form>
    </section>

    <footer>
        <p>Contacto: soporte@gamezone.cl | Dirección: Av. España 123, Santiago</p>
    </footer>

</body>
</html>
